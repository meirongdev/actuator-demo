spring:
  main:
    banner-mode: "off"
  application:
    name: actuator-demo2
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: "jdbc:h2:mem:actuatordemo;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: "" ## only for demo, do not use in production
    hikari:
      pool-name: demo-pool
      ## deliberately tiny so the pool is easy to saturate from a terminal
      maximum-pool-size: 5
      minimum-idle: 2
      ## HikariConfig takes plain millis here, not Boot's Duration strings.
      ## 20s is long enough that hikaricp.connections.pending stays observable
      ## while you click around /actuator/metrics in a browser.
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 600000
  # security:
  #   user:
  #     name: admin
  #     password: 123456 ## only for demo, do not use in production

server:
  port: 8080

management:
  info:
    build:
      enabled: true
    git:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
    java:
      enabled: true
    ssl:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
  #   shutdown:
  #     access: unrestricted
  #   heapdump:
  #     access: unrestricted
    health:
      show-details: always
      status:
# https://docs.spring.io/spring-boot/api/java/org/springframework/boot/actuate/health/Status.html
        order: down, out-of-service, unknown, up
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 500
          up: 200
      cache:
        time-to-live: 15s
      probes:
        enabled: true
        # make the liveness group available at /livez
        # and the readiness group available at /readyz on the main server port.
        add-additional-paths: true
      group:
        liveness:
          include: livenessState, diskSpace
        readiness:
          include: readinessState, redis, db
    info:
      cache:
        time-to-live: 1h
    env:
      show-values: always
    configprops:
      ## unlike env, this one masks every value by default
      show-values: always
  server:
    port: 8081
